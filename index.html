<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TensioCare - Control Clínico de Tensión Arterial</title>
    <meta name="description" content="Aplicación clínica de monitorización y registro ambulatorio de presión arterial (AMPA) según criterios ESH/ESC con análisis, períodos y reportes médicos." />
    <meta property="og:title" content="TensioCare - Control Clínico de Tensión Arterial" />
    <meta property="og:description" content="Aplicación clínica de monitorización y registro ambulatorio de presión arterial (AMPA) según criterios ESH/ESC con análisis, períodos y reportes médicos." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#005570" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TensioCare" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Suppress Vite HMR WebSocket connection closed warnings in iframe sandbox
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('websocket') || e.message.includes('[vite]'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('websocket'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });

      // Automatically eliminate Netlify floating logo or drawer if injected
      (function() {
        function removeNetlify() {
          const targets = document.querySelectorAll('[data-netlify-drawer], #netlify-badge, .netlify-badge, #netlify-feedback-badge, [class*="netlify-drawer"], [id*="netlify"], iframe[src*="netlify"]');
          targets.forEach(function(el) {
            el.remove();
          });
        }
        removeNetlify();
        if (window.MutationObserver) {
          var obs = new MutationObserver(removeNetlify);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
